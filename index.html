<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Sim</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #4a7ab5; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; top: 14px; left: 14px;
      color: #0f0; font: bold 13px/2 monospace;
      text-shadow: 0 0 6px #003300;
      pointer-events: none;
    }
    #controls {
      position: fixed; bottom: 36px; right: 14px;
      color: rgba(255,255,255,0.75); font: 12px/1.8 monospace;
      text-align: right; pointer-events: none;
    }
    footer {
      position: fixed; bottom: 0; width: 100%; text-align: center;
      padding: 5px; font: 11px sans-serif;
      color: rgba(255,255,255,0.4); pointer-events: none;
    }
    footer a { color: rgba(255,255,255,0.5); text-decoration: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div>ALT <span id="alt">0</span> m</div>
    <div>SPD <span id="spd">0</span> m/s</div>
    <div>HDG <span id="hdg">000</span>&deg;</div>
    <div>THR <span id="thr">60</span>%</div>
  </div>
  <div id="controls">
    &uarr; &darr; &nbsp; Pitch<br>
    &larr; &rarr; &nbsp; Roll<br>
    W / S &nbsp; Throttle<br>
    Q / E &nbsp; Yaw
  </div>
  <footer>Built by Fleet &middot; <a href="https://hire.autonomous-fleet.workers.dev">Alpha access</a></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"></script>
  <script>
'use strict';

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');
if (!gl) {
  document.body.innerHTML = '<p style="color:#f55;padding:24px;font-family:sans-serif">WebGL is not supported in this browser.</p>';
  throw new Error('no webgl');
}

// ── Shader helpers ─────────────────────────────────────────────────────────

function mkShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error('Shader error: ' + gl.getShaderInfoLog(s));
  return s;
}

function mkProg(vsSrc, fsSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, mkShader(gl.VERTEX_SHADER,   vsSrc));
  gl.attachShader(p, mkShader(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS))
    throw new Error('Program error: ' + gl.getProgramInfoLog(p));
  return p;
}

// ── Shader sources ─────────────────────────────────────────────────────────

// Ground: procedural checkerboard from world-space position
const GROUND_VS = `
  attribute vec3 aPos;
  uniform mat4 uMVP;
  varying vec3 vWP;
  void main() {
    gl_Position = uMVP * vec4(aPos, 1.0);
    vWP = aPos;
  }`;
const GROUND_FS = `
  precision mediump float;
  varying vec3 vWP;
  void main() {
    float c = mod(floor(vWP.x / 60.0) + floor(vWP.z / 60.0), 2.0);
    vec3 col = c < 1.0 ? vec3(0.20, 0.50, 0.20) : vec3(0.28, 0.60, 0.28);
    gl_FragColor = vec4(col, 1.0);
  }`;

// Plane: per-vertex colour
const PLANE_VS = `
  attribute vec3 aPos;
  attribute vec3 aCol;
  uniform mat4 uMVP;
  varying vec3 vCol;
  void main() {
    gl_Position = uMVP * vec4(aPos, 1.0);
    vCol = aCol;
  }`;
const PLANE_FS = `
  precision mediump float;
  varying vec3 vCol;
  void main() { gl_FragColor = vec4(vCol, 1.0); }`;

const groundProg = mkProg(GROUND_VS, GROUND_FS);
const planeProg  = mkProg(PLANE_VS,  PLANE_FS);

// ── Ground buffer ──────────────────────────────────────────────────────────
// One huge quad; checkerboard computed in fragment shader.
const groundBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, groundBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
  -30000, 0, -30000,   30000, 0, -30000,   30000, 0,  30000,
  -30000, 0, -30000,   30000, 0,  30000,  -30000, 0,  30000,
]), gl.STATIC_DRAW);

// ── Plane geometry ─────────────────────────────────────────────────────────
// Convention: nose = +Z, up = +Y, right = +X (all in local space).

function addBox(arr, x0, y0, z0, x1, y1, z1, r, g, b) {
  // 6 faces × 2 triangles × 3 vertices = 36 vertices per box.
  const faces = [
    [x0,y0,z1, x1,y0,z1, x1,y1,z1, x0,y0,z1, x1,y1,z1, x0,y1,z1], // +Z face
    [x1,y0,z0, x0,y0,z0, x0,y1,z0, x1,y0,z0, x0,y1,z0, x1,y1,z0], // -Z face
    [x0,y0,z0, x0,y0,z1, x0,y1,z1, x0,y0,z0, x0,y1,z1, x0,y1,z0], // -X face
    [x1,y0,z1, x1,y0,z0, x1,y1,z0, x1,y0,z1, x1,y1,z0, x1,y1,z1], // +X face
    [x0,y1,z1, x1,y1,z1, x1,y1,z0, x0,y1,z1, x1,y1,z0, x0,y1,z0], // +Y face
    [x0,y0,z0, x1,y0,z0, x1,y0,z1, x0,y0,z0, x1,y0,z1, x0,y0,z1], // -Y face
  ];
  for (const face of faces) {
    for (let i = 0; i < face.length; i += 3) {
      arr.push(face[i], face[i+1], face[i+2], r, g, b);
    }
  }
}

const planeVerts = [];
addBox(planeVerts, -0.3, -0.3, -2.2,  0.3,  0.3,  2.2,  0.76, 0.76, 0.82); // fuselage
addBox(planeVerts, -3.5, -0.1, -0.6,  3.5,  0.1,  0.6,  0.70, 0.72, 0.78); // main wings
addBox(planeVerts, -1.4, -0.07,-2.05, 1.4,  0.07,-1.50, 0.68, 0.70, 0.76); // horizontal tail
addBox(planeVerts, -0.06, 0.05,-2.1,  0.06, 0.90,-1.5,  0.64, 0.67, 0.74); // vertical tail
addBox(planeVerts, -0.22, 0.28, 0.2,  0.22, 0.62,  1.0,  0.33, 0.55, 0.78); // canopy

const planeBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, planeBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(planeVerts), gl.STATIC_DRAW);
const planeVertCount = planeVerts.length / 6;

// ── State ──────────────────────────────────────────────────────────────────

const state = {
  pos:      vec3.fromValues(0, 150, 0),
  q:        quat.create(),   // identity: level, nose pointing +Z
  speed:    80,              // m/s
  throttle: 0.55,
};

const keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true;  e.preventDefault(); }, { passive: false });
window.addEventListener('keyup',   e => { keys[e.key] = false; });

// ── Matrices ───────────────────────────────────────────────────────────────

const proj   = mat4.create();
const view   = mat4.create();
const mvp    = mat4.create();
const modelM = mat4.create();

function resize() {
  canvas.width  = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
  gl.viewport(0, 0, canvas.width, canvas.height);
  mat4.perspective(proj, Math.PI / 3, canvas.width / canvas.height, 0.5, 100000);
}
window.addEventListener('resize', resize);
resize();

// ── Physics ────────────────────────────────────────────────────────────────

const MAX_SPEED  = 220;   // m/s at full throttle
const MIN_GLIDE  = 25;    // m/s (stall speed; below this plane sinks fast)
const PITCH_RATE = 1.1;   // rad/s
const ROLL_RATE  = 1.4;
const YAW_RATE   = 0.7;
const GRAVITY    = 5.0;   // m/s² (gentler than real, keeps it fun)

function update(dt) {
  // Throttle
  if (keys['w'] || keys['W']) state.throttle = Math.min(1.0, state.throttle + 0.35 * dt);
  if (keys['s'] || keys['S']) state.throttle = Math.max(0.0, state.throttle - 0.35 * dt);

  // Target airspeed from throttle
  const target = MIN_GLIDE + state.throttle * (MAX_SPEED - MIN_GLIDE);
  state.speed  = state.speed + (target - state.speed) * Math.min(1, 1.2 * dt);

  // Rotations — all in the plane's local (body) frame
  if (keys['ArrowUp'])   quat.rotateX(state.q, state.q,  PITCH_RATE * dt);  // pitch up
  if (keys['ArrowDown']) quat.rotateX(state.q, state.q, -PITCH_RATE * dt);  // pitch down
  if (keys['ArrowLeft']) quat.rotateZ(state.q, state.q,  ROLL_RATE  * dt);  // roll left
  if (keys['ArrowRight'])quat.rotateZ(state.q, state.q, -ROLL_RATE  * dt);  // roll right
  if (keys['q'] || keys['Q']) quat.rotateY(state.q, state.q,  YAW_RATE * dt); // yaw left
  if (keys['e'] || keys['E']) quat.rotateY(state.q, state.q, -YAW_RATE * dt); // yaw right

  quat.normalize(state.q, state.q);

  // Forward direction in world space
  const fwd = vec3.transformQuat(vec3.create(), [0, 0, 1], state.q);

  // Move along forward vector
  state.pos[0] += fwd[0] * state.speed * dt;
  state.pos[1] += fwd[1] * state.speed * dt;
  state.pos[2] += fwd[2] * state.speed * dt;

  // Gravity — reduced by speed (more speed = more lift)
  const liftFactor = Math.min(1, state.speed / 80);
  state.pos[1] -= GRAVITY * (1 - liftFactor * 0.8) * dt;

  // Ground floor
  if (state.pos[1] < 4) state.pos[1] = 4;
}

// ── Render ─────────────────────────────────────────────────────────────────

function render() {
  gl.clearColor(0.44, 0.67, 0.94, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);

  // Camera: positioned behind and above the plane in its local frame
  const camOff = vec3.transformQuat(vec3.create(), [0, 5, -16], state.q);
  const camPos  = vec3.add(vec3.create(), state.pos, camOff);
  // Look a little ahead of centre mass
  const ahead   = vec3.transformQuat(vec3.create(), [0, 0, 3], state.q);
  const lookTgt = vec3.add(vec3.create(), state.pos, ahead);
  mat4.lookAt(view, camPos, lookTgt, [0, 1, 0]);

  // ── Ground ──
  gl.useProgram(groundProg);
  mat4.multiply(mvp, proj, view);  // model = identity (ground stays put)
  gl.uniformMatrix4fv(gl.getUniformLocation(groundProg, 'uMVP'), false, mvp);
  gl.bindBuffer(gl.ARRAY_BUFFER, groundBuf);
  const gPosLoc = gl.getAttribLocation(groundProg, 'aPos');
  gl.enableVertexAttribArray(gPosLoc);
  gl.vertexAttribPointer(gPosLoc, 3, gl.FLOAT, false, 12, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 6);

  // ── Plane ──
  gl.useProgram(planeProg);
  mat4.fromRotationTranslation(modelM, state.q, state.pos);
  mat4.scale(modelM, modelM, [2.2, 2.2, 2.2]);  // scale up for visibility
  mat4.multiply(mvp, proj, view);
  mat4.multiply(mvp, mvp, modelM);
  gl.uniformMatrix4fv(gl.getUniformLocation(planeProg, 'uMVP'), false, mvp);
  gl.bindBuffer(gl.ARRAY_BUFFER, planeBuf);
  const pPosLoc = gl.getAttribLocation(planeProg, 'aPos');
  const pColLoc = gl.getAttribLocation(planeProg, 'aCol');
  gl.enableVertexAttribArray(pPosLoc);
  gl.enableVertexAttribArray(pColLoc);
  gl.vertexAttribPointer(pPosLoc, 3, gl.FLOAT, false, 24,  0);
  gl.vertexAttribPointer(pColLoc, 3, gl.FLOAT, false, 24, 12);
  gl.drawArrays(gl.TRIANGLES, 0, planeVertCount);
}

// ── HUD ────────────────────────────────────────────────────────────────────

const altEl = document.getElementById('alt');
const spdEl = document.getElementById('spd');
const hdgEl = document.getElementById('hdg');
const thrEl = document.getElementById('thr');

function updateHUD() {
  altEl.textContent = Math.max(0, Math.round(state.pos[1]));
  spdEl.textContent = Math.round(state.speed);
  const fwd = vec3.transformQuat(vec3.create(), [0, 0, 1], state.q);
  const hdg = ((Math.atan2(fwd[0], fwd[2]) * 180 / Math.PI) + 360) % 360;
  hdgEl.textContent = String(Math.round(hdg)).padStart(3, '0');
  thrEl.textContent = Math.round(state.throttle * 100);
}

// ── Main loop ──────────────────────────────────────────────────────────────

let prev = 0;
function frame(ts) {
  const dt = prev ? Math.min((ts - prev) / 1000, 0.05) : 0.016;
  prev = ts;
  update(dt);
  render();
  updateHUD();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
  </script>
</body>
</html>
