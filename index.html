<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Sim</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%E2%9C%88%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #87a8c4; font-family: -apple-system, system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; top: 14px; left: 14px;
      color: #0f0; font: bold 13px/1.7 "JetBrains Mono", monospace;
      text-shadow: 0 0 6px rgba(0,40,0,0.9);
      pointer-events: none;
      padding: 8px 12px;
      background: rgba(0,0,0,0.32);
      border-left: 2px solid #0f0;
      border-radius: 0 4px 4px 0;
    }
    #hud .row { display: flex; gap: 10px; min-width: 170px; }
    #hud .row span:first-child { color: rgba(0,255,0,0.55); width: 36px; }
    #hud .row span:last-child { color: #0f0; margin-left: auto; font-variant-numeric: tabular-nums; }
    #attitude {
      position: fixed; bottom: 80px; left: 14px;
      width: 110px; height: 110px;
      border: 2px solid rgba(0,255,0,0.6);
      border-radius: 50%;
      overflow: hidden;
      background: linear-gradient(to bottom, #74a8df 0%, #74a8df 50%, #6b4f2a 50%, #6b4f2a 100%);
      pointer-events: none;
      box-shadow: 0 0 12px rgba(0,255,0,0.3);
    }
    #attitudeInner {
      position: absolute; inset: 0;
      transition: none;
    }
    #attitudeCross {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 60px; height: 2px; background: #ffd966;
      box-shadow: 0 0 4px rgba(255,217,102,0.8);
    }
    #attitudeCross::before {
      content: ''; position: absolute; left: 50%; top: -8px;
      width: 2px; height: 18px; background: #ffd966; transform: translateX(-50%);
    }
    #weather {
      position: fixed; top: 14px; right: 14px;
      color: #fff; font: 12px/1.7 "JetBrains Mono", monospace;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      pointer-events: none;
      padding: 8px 12px;
      background: rgba(0,0,0,0.32);
      border-radius: 4px;
      min-width: 170px;
    }
    #weather .on { color: #ffd966; }
    #weather .off { color: rgba(255,255,255,0.4); }
    #controls {
      position: fixed; bottom: 32px; right: 14px;
      color: rgba(255,255,255,0.85); font: 11.5px/1.75 "JetBrains Mono", monospace;
      text-align: right; pointer-events: none;
      text-shadow: 0 1px 2px rgba(0,0,0,0.55);
    }
    #controls kbd {
      display: inline-block;
      padding: 1px 6px;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 3px;
      font: 10.5px "JetBrains Mono", monospace;
      color: #fff;
    }
    #message {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      padding: 18px 28px;
      background: rgba(0,0,0,0.78); color: #fff;
      font: bold 18px sans-serif; border-radius: 8px;
      pointer-events: none; opacity: 0;
      transition: opacity 0.35s ease;
      text-align: center; line-height: 1.4;
      white-space: pre;
    }
    #message.show { opacity: 1; }
    footer {
      position: fixed; bottom: 0; width: 100%; text-align: center;
      padding: 5px; font: 11px sans-serif;
      color: rgba(255,255,255,0.5); pointer-events: none;
    }
    footer a { color: rgba(255,255,255,0.6); text-decoration: none; }
  </style>
</head>
<body>
  <div id="hud">
    <div class="row"><span>ALT</span><span id="alt">0</span><span style="color:rgba(0,255,0,0.5)">m</span></div>
    <div class="row"><span>IAS</span><span id="spd">0</span><span style="color:rgba(0,255,0,0.5)">m/s</span></div>
    <div class="row"><span>HDG</span><span id="hdg">000</span><span style="color:rgba(0,255,0,0.5)">&deg;</span></div>
    <div class="row"><span>THR</span><span id="thr">55</span><span style="color:rgba(0,255,0,0.5)">%</span></div>
    <div class="row"><span>AoA</span><span id="aoa">0</span><span style="color:rgba(0,255,0,0.5)">&deg;</span></div>
    <div class="row"><span>G</span><span id="gforce">1.0</span><span style="color:rgba(0,255,0,0.5)">g</span></div>
  </div>
  <div id="attitude"><div id="attitudeInner"><div id="attitudeCross"></div></div></div>
  <div id="weather">
    <div>WIND <span id="windState" class="off">OFF</span> <span id="windDetail" style="opacity:0.55"></span></div>
    <div>FOG <span id="fogState" class="off">OFF</span></div>
    <div>VIEW <span id="viewMode">chase</span></div>
    <div style="margin-top:6px; color:rgba(255,255,255,0.55); font-size:11px;">Runway: <span id="runwayDist" style="color:#ffd966">--</span></div>
  </div>
  <div id="controls">
    <div><kbd>&larr;</kbd> <kbd>&rarr;</kbd> &nbsp; Turn</div>
    <div><kbd>&uarr;</kbd> <kbd>&darr;</kbd> &nbsp; Pitch</div>
    <div><kbd>W</kbd> <kbd>S</kbd> &nbsp;&nbsp; Throttle</div>
    <div><kbd>Q</kbd> <kbd>E</kbd> &nbsp;&nbsp; Yaw (rudder)</div>
    <div style="margin-top:6px;"><kbd>C</kbd> View &nbsp; <kbd>R</kbd> Wind &nbsp; <kbd>F</kbd> Fog &nbsp; <kbd>Space</kbd> Reset</div>
  </div>
  <div id="message"></div>
  <footer>Built by Fleet &middot; <a href="https://hire.autonomous-fleet.workers.dev">Alpha access</a> &middot; <span style="opacity:0.7;font-family:monospace;">v15</span></footer>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.166.0/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';

    // ─────────────────────────────────────────────────────────────────────────
    // SCENE + RENDERER
    // ─────────────────────────────────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();

    // Procedural sky
    function makeSkyTexture() {
      const c = document.createElement('canvas');
      c.width = 2; c.height = 256;
      const ctx = c.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, 256);
      grad.addColorStop(0, '#1d4a85');
      grad.addColorStop(0.5, '#7eb4dd');
      grad.addColorStop(1, '#e8ebed');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 2, 256);
      const tex = new THREE.CanvasTexture(c);
      tex.mapping = THREE.EquirectangularReflectionMapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    const skyTex = makeSkyTexture();
    scene.background = skyTex;
    scene.environment = skyTex;

    // Fog (will be enabled/disabled per state)
    scene.fog = new THREE.Fog(0xb8c8d2, 800, 8000);
    let fogEnabled = false;
    scene.fog.near = 60000;  // start with fog effectively off
    scene.fog.far  = 100000;

    // ─────────────────────────────────────────────────────────────────────────
    // LIGHTING
    // ─────────────────────────────────────────────────────────────────────────
    const sun = new THREE.DirectionalLight(0xfff2d0, 2.2);
    sun.position.set(2000, 3000, 1500);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 100;
    sun.shadow.camera.far = 6000;
    sun.shadow.camera.left = -200; sun.shadow.camera.right = 200;
    sun.shadow.camera.top = 200;  sun.shadow.camera.bottom = -200;
    sun.shadow.bias = -0.0005;
    scene.add(sun);

    const ambient = new THREE.HemisphereLight(0xb0c8e0, 0x4a5232, 0.8);
    scene.add(ambient);

    // ─────────────────────────────────────────────────────────────────────────
    // GROUND with procedural grass + runway textures
    // ─────────────────────────────────────────────────────────────────────────
    function makeGroundTexture() {
      const size = 1024;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      // Base grass green
      ctx.fillStyle = '#3d6b32';
      ctx.fillRect(0, 0, size, size);
      // Noise speckles
      for (let i = 0; i < 12000; i++) {
        const x = Math.random() * size, y = Math.random() * size;
        const v = Math.random() * 40 - 20;
        ctx.fillStyle = `rgb(${61+v},${107+v},${50+v})`;
        ctx.fillRect(x, y, 2, 2);
      }
      // Darker patches
      for (let i = 0; i < 80; i++) {
        const x = Math.random() * size, y = Math.random() * size;
        const r = 20 + Math.random() * 50;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, 'rgba(50,80,40,0.4)');
        g.addColorStop(1, 'rgba(50,80,40,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(800, 800);
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    const groundTex = makeGroundTexture();
    const groundGeom = new THREE.PlaneGeometry(60000, 60000, 1, 1);
    groundGeom.rotateX(-Math.PI / 2);
    const groundMat = new THREE.MeshStandardMaterial({ map: groundTex, roughness: 1.0, metalness: 0 });
    const ground = new THREE.Mesh(groundGeom, groundMat);
    ground.receiveShadow = true;
    ground.position.y = 0;
    scene.add(ground);

    // Runway texture
    function makeRunwayTexture() {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#1d1f24';
      ctx.fillRect(0, 0, 128, 512);
      // Edge markings
      ctx.fillStyle = '#d8d8d8';
      ctx.fillRect(8, 0, 4, 512);
      ctx.fillRect(116, 0, 4, 512);
      // Dashed centerline
      ctx.fillStyle = '#f2f2f2';
      for (let y = 20; y < 512; y += 60) {
        ctx.fillRect(60, y, 8, 32);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 6);
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    const runwayTex = makeRunwayTexture();
    function makeRunway(x, z, rotY) {
      const geom = new THREE.PlaneGeometry(70, 1200);
      geom.rotateX(-Math.PI / 2);
      // polygonOffset pushes the runway slightly toward the camera in depth
      // so it doesn't z-fight with the ground plane at large distances.
      const mat = new THREE.MeshStandardMaterial({
        map: runwayTex,
        roughness: 0.85,
        metalness: 0,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        polygonOffsetUnits: -2,
      });
      const m = new THREE.Mesh(geom, mat);
      m.position.set(x, 0.5, z);          // lift well above the ground plane to eliminate flicker
      m.rotation.y = rotY;
      m.receiveShadow = true;
      m.renderOrder = 1;                  // draw after ground
      return m;
    }
    const RUNWAY1 = { x: 0, z: 0, rot: 0 };
    const RUNWAY2 = { x: 2400, z: 1800, rot: Math.PI / 3 };
    scene.add(makeRunway(RUNWAY1.x, RUNWAY1.z, RUNWAY1.rot));
    scene.add(makeRunway(RUNWAY2.x, RUNWAY2.z, RUNWAY2.rot));

    // ─────────────────────────────────────────────────────────────────────────
    // PLANE — procedural detailed model
    // ─────────────────────────────────────────────────────────────────────────
    const plane = new THREE.Group();

    const fuselageMat = new THREE.MeshStandardMaterial({ color: 0xe8ecf0, roughness: 0.55, metalness: 0.35 });
    const wingMat     = new THREE.MeshStandardMaterial({ color: 0xdde2e8, roughness: 0.50, metalness: 0.30 });
    const accentMat   = new THREE.MeshStandardMaterial({ color: 0xc62828, roughness: 0.45, metalness: 0.2 });
    const canopyMat   = new THREE.MeshPhysicalMaterial({
      color: 0x1d2638, roughness: 0.05, metalness: 0,
      transmission: 0.6, thickness: 0.3, transparent: true, opacity: 0.65,
      clearcoat: 1.0, clearcoatRoughness: 0.05,
    });
    const propMat     = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6, metalness: 0.1 });
    const tireMat     = new THREE.MeshStandardMaterial({ color: 0x0d0d0d, roughness: 0.95, metalness: 0 });

    // Fuselage — capsule shape (cylinder + caps)
    const fuseGeom = new THREE.CapsuleGeometry(0.55, 4.5, 8, 16);
    fuseGeom.rotateX(Math.PI / 2);
    const fuse = new THREE.Mesh(fuseGeom, fuselageMat);
    fuse.castShadow = true;
    plane.add(fuse);

    // Nose cone
    const noseGeom = new THREE.ConeGeometry(0.55, 1.2, 16);
    noseGeom.rotateX(Math.PI / 2);
    const nose = new THREE.Mesh(noseGeom, accentMat);
    nose.position.z = 3.1;
    nose.castShadow = true;
    plane.add(nose);

    // Propeller hub + blades (spins)
    const propHub = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 8), propMat);
    propHub.position.z = 3.75;
    plane.add(propHub);
    const propGroup = new THREE.Group();
    propGroup.position.z = 3.78;
    const bladeGeom = new THREE.BoxGeometry(0.08, 2.8, 0.04);
    for (let i = 0; i < 2; i++) {
      const blade = new THREE.Mesh(bladeGeom, propMat);
      blade.rotation.z = (i * Math.PI / 2);
      propGroup.add(blade);
    }
    plane.add(propGroup);

    // Main wings — with dihedral + slight sweep (built as two halves)
    function makeWing(side) {
      const g = new THREE.BoxGeometry(4.5, 0.12, 1.5);
      // taper: not easily done with BoxGeometry; we'll fake with a separate tip mesh
      const w = new THREE.Mesh(g, wingMat);
      w.position.set(side * 2.6, -0.05, 0.2);
      w.rotation.z = side * 0.06;  // dihedral ~3.5°
      w.rotation.y = side * 0.08;  // slight sweepback
      w.castShadow = true;
      return w;
    }
    plane.add(makeWing(1));
    plane.add(makeWing(-1));

    // Wing tips (rounded)
    function makeTip(side) {
      const g = new THREE.CapsuleGeometry(0.06, 0.6, 4, 6);
      g.rotateZ(Math.PI / 2);
      const t = new THREE.Mesh(g, wingMat);
      t.position.set(side * 4.95, -0.05 + side * 0.32, 0.2);
      t.castShadow = true;
      return t;
    }
    plane.add(makeTip(1));
    plane.add(makeTip(-1));

    // Horizontal stabilizer
    const hstabGeom = new THREE.BoxGeometry(2.6, 0.08, 0.7);
    const hstab = new THREE.Mesh(hstabGeom, wingMat);
    hstab.position.set(0, 0.1, -2.4);
    hstab.castShadow = true;
    plane.add(hstab);

    // Vertical stabilizer
    const vstabGeom = new THREE.BoxGeometry(0.08, 1.0, 1.0);
    const vstab = new THREE.Mesh(vstabGeom, wingMat);
    vstab.position.set(0, 0.6, -2.5);
    vstab.castShadow = true;
    plane.add(vstab);
    // Rudder accent
    const rudGeom = new THREE.BoxGeometry(0.1, 0.85, 0.45);
    const rudder = new THREE.Mesh(rudGeom, accentMat);
    rudder.position.set(0, 0.62, -2.85);
    rudder.castShadow = true;
    plane.add(rudder);

    // Canopy
    const canopyGeom = new THREE.SphereGeometry(0.7, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2);
    canopyGeom.scale(0.85, 0.7, 1.4);
    const canopy = new THREE.Mesh(canopyGeom, canopyMat);
    canopy.position.set(0, 0.45, 0.4);
    canopy.castShadow = true;
    plane.add(canopy);

    // Landing gear (3 wheels + struts)
    function makeWheel(x, y, z) {
      const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.18, 16), tireMat);
      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(x, y, z);
      wheel.castShadow = true;
      return wheel;
    }
    function makeStrut(x, y, z) {
      const s = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.6, 6), propMat);
      s.position.set(x, y, z);
      s.castShadow = true;
      return s;
    }
    plane.add(makeStrut(1.0, -0.6, 0.3));
    plane.add(makeStrut(-1.0, -0.6, 0.3));
    plane.add(makeWheel(1.0, -0.95, 0.3));
    plane.add(makeWheel(-1.0, -0.95, 0.3));
    plane.add(makeStrut(0, -0.5, -2.3));
    plane.add(makeWheel(0, -0.85, -2.3));

    // Red stripe along fuselage
    const stripeGeom = new THREE.BoxGeometry(1.1, 0.04, 4.2);
    const stripe = new THREE.Mesh(stripeGeom, accentMat);
    stripe.position.set(0, 0.15, -0.1);
    plane.add(stripe);

    plane.scale.set(1.6, 1.6, 1.6);
    scene.add(plane);

    // ─────────────────────────────────────────────────────────────────────────
    // CAMERA
    // ─────────────────────────────────────────────────────────────────────────
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.5, 80000);

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });

    // ─────────────────────────────────────────────────────────────────────────
    // CLOUDS — sprite-like billboards
    // ─────────────────────────────────────────────────────────────────────────
    function makeCloudTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(64, 64, 5, 64, 64, 60);
      g.addColorStop(0, 'rgba(255,255,255,0.95)');
      g.addColorStop(0.6, 'rgba(255,255,255,0.4)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(64, 64, 60, 0, Math.PI*2); ctx.fill();
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    const cloudTex = makeCloudTexture();
    const cloudMat = new THREE.SpriteMaterial({ map: cloudTex, depthWrite: false, transparent: true, opacity: 0.9 });
    for (let i = 0; i < 120; i++) {
      const s = new THREE.Sprite(cloudMat);
      s.position.set((Math.random() - 0.5) * 12000, 400 + Math.random() * 900, (Math.random() - 0.5) * 12000);
      const scale = 200 + Math.random() * 380;
      s.scale.set(scale, scale * 0.55, 1);
      scene.add(s);
    }

    // ─────────────────────────────────────────────────────────────────────────
    // FLIGHT PHYSICS — real-ish aerodynamic model
    //
    // Forces applied per frame in world space:
    //   - Weight: -mg ĵ
    //   - Thrust: throttle * T_max along plane forward axis
    //   - Lift: ½ ρ v² S Cl, perpendicular to relative-wind, in wing plane
    //   - Drag: ½ ρ v² S (Cd0 + k Cl²), opposite to velocity
    //
    // Control surfaces produce angular rates directly (simplified):
    //   - Elevator → pitch rate (modulated by dynamic pressure)
    //   - Aileron  → roll rate
    //   - Rudder   → yaw rate
    //   - Plus stability derivatives: roll causes adverse yaw / weathervane;
    //     bank causes coordinated turn (gravity tilts lift vector horizontally).
    // ─────────────────────────────────────────────────────────────────────────
    const MASS         = 800;           // kg
    const GRAVITY      = 9.81;          // m/s²
    const AIR_DENSITY  = 1.225;         // kg/m³ (sea level)
    const WING_AREA    = 16;            // m² (Cessna-ish)
    const CL_ALPHA     = 5.5;           // lift slope per radian (typical: 2π * 0.9)
    const CL_MAX       = 1.4;
    const CD0          = 0.028;
    const K_INDUCED    = 0.045;         // induced-drag factor
    const T_MAX        = 4500;          // N at full throttle
    const STALL_ALPHA  = 16 * Math.PI / 180;  // ~16° stall
    const ELEV_RATE    = 1.4;           // rad/s pitch authority at design speed
    const AIL_RATE     = 2.2;
    const RUD_RATE     = 0.9;
    const DESIGN_SPEED = 50;            // m/s
    const WIND_SPEED   = 9;             // m/s sideways drift when wind is on
    const GROUND_Y     = 1.2;           // gear height when on ground

    function initState() {
      // Start in level flight, 200m up, 300m south of runway 1, heading north
      return {
        pos:      new THREE.Vector3(0, 200, -2200),
        // Quaternion: identity → nose toward +Z (north)
        q:        new THREE.Quaternion(),
        // Linear velocity in world space (m/s)
        vel:      new THREE.Vector3(0, 0, 45),
        throttle: 0.55,
        wind:     false,
        windDir:  Math.random() * Math.PI * 2,
        fog:      false,
        cockpit:  false,
        crashed:  false,
        touchdownLatched: false,
        propAngle: 0,
      };
    }
    let state = initState();

    const keys = {};
    let msgTimer = 0;
    const msgEl = document.getElementById('message');
    function flash(text, dur = 1.6) {
      msgEl.textContent = text;
      msgEl.classList.add('show');
      msgTimer = dur;
    }
    window.addEventListener('keydown', e => {
      if (!keys[e.key]) {
        if (e.key === 'r' || e.key === 'R') {
          state.wind = !state.wind;
          if (state.wind) state.windDir = Math.random() * Math.PI * 2;
          flash(state.wind ? 'Wind on' : 'Wind off');
        } else if (e.key === 'f' || e.key === 'F') {
          state.fog = !state.fog;
          if (state.fog) {
            scene.fog.color.set(0xc0c8d0);
            scene.fog.near = 200;
            scene.fog.far  = 2500;
            renderer.toneMappingExposure = 0.85;
          } else {
            scene.fog.near = 60000;
            scene.fog.far  = 100000;
            renderer.toneMappingExposure = 1.0;
          }
          flash(state.fog ? 'Fog on' : 'Fog off');
        } else if (e.key === 'c' || e.key === 'C') {
          state.cockpit = !state.cockpit;
          flash(state.cockpit ? 'Cockpit view' : 'Chase cam');
        } else if (e.key === ' ') {
          const prevCockpit = state.cockpit;
          const prevWind = state.wind, prevFog = state.fog, prevDir = state.windDir;
          state = initState();
          state.cockpit = prevCockpit;
          state.wind = prevWind; state.fog = prevFog; state.windDir = prevDir;
          flash('Reset');
        }
      }
      keys[e.key] = true;
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    }, { passive: false });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    // Reusable vectors
    const TMP_F = new THREE.Vector3();
    const TMP_R = new THREE.Vector3();
    const TMP_U = new THREE.Vector3();
    const TMP_V = new THREE.Vector3();
    const TMP_Q = new THREE.Quaternion();

    function updatePhysics(dt) {
      if (state.crashed) return;

      // Throttle input
      if (keys['w'] || keys['W']) state.throttle = Math.min(1.0, state.throttle + 0.5 * dt);
      if (keys['s'] || keys['S']) state.throttle = Math.max(0.0, state.throttle - 0.5 * dt);

      // Body axes from current orientation
      TMP_F.set(0, 0, 1).applyQuaternion(state.q);  // forward (nose)
      TMP_R.set(1, 0, 0).applyQuaternion(state.q);  // right wing
      TMP_U.set(0, 1, 0).applyQuaternion(state.q);  // top of plane

      // Relative wind = (-velocity) in body frame
      TMP_V.copy(state.vel);
      const airspeed = TMP_V.length();
      const q_dyn = 0.5 * AIR_DENSITY * airspeed * airspeed;
      const speedFactor = Math.min(1.5, airspeed / DESIGN_SPEED);

      // Angle of attack: angle between body forward and velocity, in pitch plane
      // alpha = angle between fwd vector and velocity, sign from up vector
      let alpha = 0;
      if (airspeed > 0.5) {
        const v_norm = TMP_V.clone().normalize();
        const cosA = THREE.MathUtils.clamp(v_norm.dot(TMP_F), -1, 1);
        alpha = Math.acos(cosA);
        // Sign of alpha based on whether velocity is below the plane's nose
        if (v_norm.dot(TMP_U) > 0) alpha = -alpha;
      }
      // Cl curve: linear to stall, then drops sharply
      let cl;
      const absA = Math.abs(alpha);
      if (absA < STALL_ALPHA) {
        cl = CL_ALPHA * alpha;
        if (Math.abs(cl) > CL_MAX) cl = Math.sign(cl) * CL_MAX;
      } else {
        // Post-stall: lift drops
        const excess = absA - STALL_ALPHA;
        cl = Math.sign(alpha) * Math.max(0, CL_MAX - 6 * excess);
      }
      const liftMag = q_dyn * WING_AREA * cl;
      const dragMag = q_dyn * WING_AREA * (CD0 + K_INDUCED * cl * cl);

      // ── Force accumulator ──
      const force = new THREE.Vector3(0, -MASS * GRAVITY, 0);

      // Thrust along forward
      force.addScaledVector(TMP_F, state.throttle * T_MAX);

      // Lift: perpendicular to velocity, in the plane spanned by fwd × right (i.e., body up)
      // Approximated: lift acts along the body's local up vector projected to be perpendicular to velocity.
      if (airspeed > 0.5) {
        const v_norm = TMP_V.clone().normalize();
        // Lift direction = (body_up - (body_up · v) * v), normalized
        const dotVU = TMP_U.dot(v_norm);
        const liftDir = TMP_U.clone().addScaledVector(v_norm, -dotVU).normalize();
        force.addScaledVector(liftDir, liftMag);
        // Drag: opposite to velocity
        force.addScaledVector(v_norm, -dragMag);
      }

      // Integrate linear motion
      const accel = force.divideScalar(MASS);
      state.vel.addScaledVector(accel, dt);
      // Cap velocity to avoid runaway
      const maxV = 280;
      if (state.vel.length() > maxV) state.vel.setLength(maxV);

      // Arcade-feel: plane goes where its nose is pointed.
      // Operator test on v8: 1.5s time constant felt unresponsive — plane still
      // slid through the air after rotating. Tightened to ~0.4s so the
      // velocity actually tracks the nose direction promptly.
      // Magnitude preserved (no energy added).
      if (airspeed > 1) {
        const blend = 1 - Math.exp(-6 * dt);  // ~0.4s response
        const targetDir = TMP_F.clone().multiplyScalar(airspeed);
        state.vel.lerp(targetDir, blend);
      }

      state.pos.addScaledVector(state.vel, dt);

      // Wind drift
      if (state.wind) {
        state.pos.x += Math.cos(state.windDir) * WIND_SPEED * dt;
        state.pos.z += Math.sin(state.windDir) * WIND_SPEED * dt;
      }

      // ── Control inputs → angular rates (in body frame) ──
      // Authority scales with dynamic pressure (slower = less responsive)
      const auth = Math.max(0.3, Math.min(1.2, speedFactor));

      let pitchRate = 0, rollRate = 0, yawRate = 0;
      const aileronInput = (keys['ArrowLeft'] ? 1 : 0) + (keys['ArrowRight'] ? -1 : 0);

      if (keys['ArrowUp'])   pitchRate += ELEV_RATE * auth;
      if (keys['ArrowDown']) pitchRate -= ELEV_RATE * auth;

      if (keys['ArrowLeft']) {
        rollRate -= AIL_RATE * auth;
        yawRate  += RUD_RATE * 0.5 * auth;
      }
      if (keys['ArrowRight']) {
        rollRate += AIL_RATE * auth;
        yawRate  -= RUD_RATE * 0.5 * auth;
      }

      if (keys['q'] || keys['Q']) yawRate += RUD_RATE * auth;
      if (keys['e'] || keys['E']) yawRate -= RUD_RATE * auth;

      // Coordinated turn: real formula is g*tan(bank)/v (world-vertical rate).
      // Clamped to keep the model sane past 70deg where tan diverges.
      const bankAngle = Math.atan2(TMP_R.y, TMP_U.y);
      const clampedBank = THREE.MathUtils.clamp(bankAngle, -1.2, 1.2);
      yawRate -= Math.tan(clampedBank) * (GRAVITY / Math.max(airspeed, 25)) * 1.1;

      // Dihedral effect: banked plane self-levels when ailerons released.
      // Stronger when no input so neutral-stick plane returns to wings-level;
      // weaker when input held so the pilot can sustain a turn.
      const dihedral = aileronInput === 0 ? 2.0 : 0.5;
      rollRate -= Math.sin(bankAngle) * dihedral;

      // Soft bank limit at 75deg — keeps the plane out of knife-edge while
      // still allowing aggressive turns. Real planes can do more; this is a
      // playable sim, not aerobatic.
      const BANK_LIMIT = 75 * Math.PI / 180;
      if (Math.abs(bankAngle) > BANK_LIMIT) {
        const overBank = Math.abs(bankAngle) - BANK_LIMIT;
        rollRate -= Math.sign(bankAngle) * overBank * 8;
      }

      // Weathervane stability: yaw tries to align nose with velocity
      if (airspeed > 5) {
        const v_norm = TMP_V.clone().normalize();
        const sideslip = TMP_R.dot(v_norm);  // positive = slipping to right
        yawRate -= sideslip * 1.2;
      }

      // Pitch stability: weak restoring force toward trim alpha. Weak so
      // throttle changes are felt — at low throttle the plane slows, lift
      // drops with v^2, and the plane descends naturally instead of the
      // autopilot fighting it.
      const trimAlpha = 2 * Math.PI / 180;
      pitchRate += (alpha - trimAlpha) * 0.15;

      // Apply rotations in body frame (intrinsic): roll, then pitch, then yaw
      TMP_Q.setFromAxisAngle(new THREE.Vector3(0, 0, 1), rollRate * dt);
      state.q.multiply(TMP_Q);
      TMP_Q.setFromAxisAngle(new THREE.Vector3(1, 0, 0), pitchRate * dt);
      state.q.multiply(TMP_Q);
      TMP_Q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), yawRate * dt);
      state.q.multiply(TMP_Q);
      state.q.normalize();

      // Propeller spin
      state.propAngle += (state.throttle * 25 + 5) * dt;

      // ── Ground contact ──
      if (state.pos.y < GROUND_Y) {
        const onR1 = Math.abs(state.pos.x) < 35 && Math.abs(state.pos.z) < 600;
        const dx = state.pos.x - RUNWAY2.x;
        const dz = state.pos.z - RUNWAY2.z;
        const ca = Math.cos(RUNWAY2.rot), sa = Math.sin(RUNWAY2.rot);
        const lx =  ca * dx + sa * dz;
        const lz = -sa * dx + ca * dz;
        const onR2 = Math.abs(lx) < 35 && Math.abs(lz) < 600;
        const onRunway = onR1 || onR2;

        const vy = state.vel.y;
        const wingsLevel = TMP_U.y > 0.85;
        const softVertical = vy > -8;
        const slowEnough  = airspeed < 70;

        if (onRunway && softVertical && wingsLevel && slowEnough) {
          state.pos.y = GROUND_Y;
          state.vel.y = Math.max(0, state.vel.y);
          // Ground friction only when throttle is low (brakes); at high
          // throttle the wheels roll freely so thrust can accelerate for
          // takeoff. Without this the plane gets glued to the runway.
          if (state.throttle < 0.15) {
            const brake = Math.exp(-2.0 * dt);
            state.vel.x *= brake;
            state.vel.z *= brake;
          } else {
            const rollResist = Math.exp(-0.08 * dt);
            state.vel.x *= rollResist;
            state.vel.z *= rollResist;
          }
          if (!state.touchdownLatched) { flash('Touchdown! 🛬'); state.touchdownLatched = true; }
        } else {
          state.crashed = true;
          state.pos.y = GROUND_Y;
          const reason =
            !onRunway   ? 'off-runway impact' :
            !softVertical ? 'descent too steep' :
            !wingsLevel ? 'wings not level' :
            !slowEnough ? 'too fast for ground' : 'impact';
          flash('💥 Crashed — ' + reason + '\nPress Space to reset', 6);
        }
      } else {
        state.touchdownLatched = false;
      }
    }

    // ─────────────────────────────────────────────────────────────────────────
    // RENDER + CAMERA
    // ─────────────────────────────────────────────────────────────────────────
    function updateCamera() {
      plane.position.copy(state.pos);
      plane.quaternion.copy(state.q);
      propGroup.rotation.z = state.propAngle;

      const camOffset = new THREE.Vector3();
      const lookOffset = new THREE.Vector3();
      const upVec = new THREE.Vector3(0, 1, 0);

      if (state.cockpit) {
        camOffset.set(0, 1.0, 1.0).applyQuaternion(state.q);
        lookOffset.set(0, 0.4, 50).applyQuaternion(state.q);
        upVec.set(0, 1, 0).applyQuaternion(state.q);
      } else {
        // Body-locked chase cam: camera moves WITH the plane (including roll).
        // The plane appears stationary on screen; the world rotates around it.
        // Pressing right banks the plane and the horizon visibly tilts left.
        // This is how real chase cams behave (War Thunder, MSFS chase, etc).
        camOffset.set(0, 5, -16).applyQuaternion(state.q);
        lookOffset.set(0, 0, 3).applyQuaternion(state.q);
        upVec.set(0, 1, 0).applyQuaternion(state.q);
      }

      camera.position.copy(state.pos).add(camOffset);
      camera.up.copy(upVec);
      camera.lookAt(state.pos.x + lookOffset.x, state.pos.y + lookOffset.y, state.pos.z + lookOffset.z);

      // Hide plane in cockpit view to avoid clipping
      plane.visible = !state.cockpit;
    }

    // ─────────────────────────────────────────────────────────────────────────
    // HUD
    // ─────────────────────────────────────────────────────────────────────────
    const altEl = document.getElementById('alt');
    const spdEl = document.getElementById('spd');
    const hdgEl = document.getElementById('hdg');
    const thrEl = document.getElementById('thr');
    const aoaEl = document.getElementById('aoa');
    const gEl   = document.getElementById('gforce');
    const windStateEl = document.getElementById('windState');
    const windDetailEl = document.getElementById('windDetail');
    const fogStateEl   = document.getElementById('fogState');
    const viewModeEl   = document.getElementById('viewMode');
    const runwayDistEl = document.getElementById('runwayDist');
    const attInner     = document.getElementById('attitudeInner');

    function compass(deg) {
      const dirs = ['N','NE','E','SE','S','SW','W','NW'];
      return dirs[Math.round(deg / 45) % 8];
    }

    function updateHUD(dt) {
      altEl.textContent = Math.max(0, Math.round(state.pos.y));
      const airspeed = state.vel.length();
      spdEl.textContent = Math.round(airspeed);

      const fwd = new THREE.Vector3(0, 0, 1).applyQuaternion(state.q);
      const hdg = ((Math.atan2(fwd.x, fwd.z) * 180 / Math.PI) + 360) % 360;
      hdgEl.textContent = String(Math.round(hdg)).padStart(3, '0');
      thrEl.textContent = Math.round(state.throttle * 100);

      // AoA estimate
      const v_norm = state.vel.clone().normalize();
      const alphaDeg = Math.round(Math.acos(THREE.MathUtils.clamp(v_norm.dot(fwd), -1, 1)) * 180 / Math.PI);
      aoaEl.textContent = airspeed > 0.5 ? alphaDeg : 0;

      // G estimate (lift / weight)
      const gforce = Math.max(0, state.vel.y > -50 ? 1 + Math.abs(fwd.y) : 1);  // rough
      gEl.textContent = gforce.toFixed(1);

      if (state.wind) {
        windStateEl.textContent = 'ON';
        windStateEl.className = 'on';
        const wd = ((state.windDir * 180 / Math.PI) + 360) % 360;
        windDetailEl.textContent = '(' + compass(wd) + ')';
      } else {
        windStateEl.textContent = 'OFF';
        windStateEl.className = 'off';
        windDetailEl.textContent = '';
      }
      fogStateEl.textContent = state.fog ? 'ON' : 'OFF';
      fogStateEl.className   = state.fog ? 'on' : 'off';
      viewModeEl.textContent = state.cockpit ? 'cockpit' : 'chase';

      const d1 = Math.hypot(state.pos.x - RUNWAY1.x, state.pos.z - RUNWAY1.z);
      const d2 = Math.hypot(state.pos.x - RUNWAY2.x, state.pos.z - RUNWAY2.z);
      const nearest = Math.min(d1, d2);
      runwayDistEl.textContent = (nearest / 1000).toFixed(1) + ' km (#' + (d1 < d2 ? '1' : '2') + ')';

      // Attitude indicator (artificial horizon)
      const right = new THREE.Vector3(1, 0, 0).applyQuaternion(state.q);
      const rollAngle = Math.atan2(right.y, new THREE.Vector3(0,1,0).applyQuaternion(state.q).y) * 180 / Math.PI;
      const pitchAngle = Math.asin(fwd.y) * 180 / Math.PI;
      attInner.style.transform = `rotate(${rollAngle}deg) translateY(${pitchAngle * 1.5}px)`;
    }

    // ─────────────────────────────────────────────────────────────────────────
    // MAIN LOOP
    // ─────────────────────────────────────────────────────────────────────────
    let prev = 0;
    function frame(ts) {
      const dt = prev ? Math.min((ts - prev) / 1000, 0.05) : 0.016;
      prev = ts;
      updatePhysics(dt);
      updateCamera();
      updateHUD(dt);
      if (msgTimer > 0) { msgTimer -= dt; if (msgTimer <= 0) msgEl.classList.remove('show'); }
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
